readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai>=2.45.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "pylint>=4.0.8",
    "pyrefly>=1.3.1",
    "ruff>=0.16.8",
]
